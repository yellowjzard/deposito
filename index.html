<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposito</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="style.css">
    <!-- Font di sistema o generico sans-serif impostato in CSS -->
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="logo">Deposito</div>
        <div class="stats" id="statsCounter">Giorni totali: <span id="totalDays">0</span></div>
    </header>

    <!-- SCHERMATA OGGI -->
    <main id="view-oggi" class="view active">
        <div class="question-container">
            <h1 id="dailyQuestion">Caricamento domanda...</h1>
            <button id="btnChangeQuestion" class="btn-text">Cambia domanda</button>
        </div>

        <div class="input-container">
            <!-- Testo -->
            <textarea id="textInput" placeholder="Scrivi qui la tua idea..."></textarea>
            
            <!-- Controlli Audio -->
            <div id="audioControls" class="audio-controls">
                <button id="btnRecord" class="btn-icon" aria-label="Registra audio">
                    <span class="icon record-icon"></span>
                </button>
                <div id="recordingStatus" class="hidden">Registrazione in corso... <span id="recordingTime">0:00</span></div>
                <button id="btnStopRecord" class="btn-icon hidden" aria-label="Ferma registrazione">
                    <span class="icon stop-icon"></span>
                </button>
            </div>

            <!-- Anteprima Audio -->
            <div id="audioPreviewContainer" class="hidden">
                <audio id="audioPreview" controls></audio>
                <button id="btnDeleteAudio" class="btn-text danger">Elimina audio</button>
            </div>
            
            <div id="micError" class="error-msg hidden">Microfono non disponibile. Puoi comunque scrivere.</div>
        </div>

        <button id="btnDeposit" class="btn-primary" disabled>Deposita</button>
        
        <div id="successMessage" class="success-msg hidden">Depositato!</div>
    </main>

    <!-- SCHERMATA ARCHIVIO -->
    <main id="view-archivio" class="view hidden">
        <h2>Il tuo deposito</h2>
        <div id="archiveList">
            <!-- Le idee verranno caricate qui dinamicamente -->
        </div>
    </main>

    <!-- NAVIGAZIONE -->
    <nav class="bottom-nav">
        <button id="navOggi" class="nav-item active">Oggi</button>
        <button id="navArchivio" class="nav-item">Archivio</button>
    </nav>

    <script src="app.js"></script>
    <script>
        // Registrazione Service Worker per PWA offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registrato con successo:', registration.scope);
                    })
                    .catch(err => {
                        console.log('Registrazione SW fallita:', err);
                    });
            });
        }
    </script>
</body>
</html>
